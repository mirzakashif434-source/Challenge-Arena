name: Build Challenge Arena Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Locate release APK
        run: |
          APK=$(find android -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" challenge-arena-release.apk
          echo "APK found at $APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: challenge-arena-release-apk
          path: challenge-arena-release.apk
          if-no-files-found: error
